[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mk8dx-analysis"
version = "0.1.0"
description = "マリオカート8DX リザルトOCR自動集計・OBSオーバーレイシステム"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
