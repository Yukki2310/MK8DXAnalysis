[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mk8dx-analysis"
version = "0.2.0"
description = "マリオカート8DX リザルトOCR自動集計・OBSオーバーレイシステム"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12.0",
    "rapidocr>=3.0",
    "onnxruntime>=1.18",
    "pystray>=0.19",
    "pygrabber>=0.2",
    "comtypes>=1.4",
    "pillow>=10.0",
]

[project.scripts]
mk8dx = "mk8dx.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
