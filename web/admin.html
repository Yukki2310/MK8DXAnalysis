<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>MK8DX 自動集計</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #eef1f6; --card: #fff; --line: #dfe4ee; --text: #1b2333; --sub: #6a7690;
    --blue: #2f6df6; --blue-d: #2457cc; --green: #1f9d55; --green-bg: #e4f5ea;
    --amber: #b7791f; --amber-bg: #fff4d6; --red: #d64545; --red-bg: #fde8e8; --gray: #8a94a8;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); display: flex; flex-direction: column;
         font: 15px/1.45 "Yu Gothic UI", "Meiryo", "Segoe UI", sans-serif; }
  button { font: inherit; border: 0; border-radius: 9px; padding: 8px 14px; cursor: pointer; font-weight: 700;
           background: var(--blue); color: #fff; }
  button:hover:not(:disabled) { background: var(--blue-d); }
  button:disabled { background: #c3cbdb; cursor: not-allowed; }
  button.ghost { background: #fff; color: var(--text); border: 1px solid var(--line); }
  button.ghost:hover:not(:disabled) { background: #f3f5fa; }
  button.go { background: var(--green); } button.go:hover:not(:disabled) { background: #187a43; }
  button.stop, button.danger { background: var(--red); } button.stop:hover, button.danger:hover { background: #b53636; }
  button.sm { padding: 4px 10px; font-size: 13px; border-radius: 7px; }
  input[type=text], select { font: inherit; padding: 6px 9px; border: 1px solid #c8d0e0; border-radius: 8px;
                             background: #fff; color: var(--text); min-width: 0; }
  input[type=text]:focus, select:focus { outline: 2px solid #a9c0fb; border-color: var(--blue); }
  input.saved { border-color: var(--green); background: var(--green-bg); }

  /* ---- ヘッダー ---- */
  #top { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: #1b2333; color: #fff; flex: none; }
  .brand { font-weight: 900; letter-spacing: .04em; margin-right: 4px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 5px 13px; border-radius: 999px; font-weight: 800;
          background: #2c3650; }
  .chip .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--gray); }
  .chip.ok { background: #1c4d33; } .chip.ok .dot { background: #4ade80; animation: pulse 1.6s infinite; }
  .chip.busy { background: #213a73; } .chip.busy .dot { background: #7aa2ff; animation: pulse .8s infinite; }
  .chip.warn { background: #6b4b0f; } .chip.warn .dot { background: #fbbf24; animation: pulse 1s infinite; }
  .chip.bad { background: #6e2222; cursor: pointer; } .chip.bad .dot { background: #f87171; }
  @keyframes pulse { 50% { opacity: .35; } }
  #raceCount { font-size: 20px; font-weight: 900; font-variant-numeric: tabular-nums; }
  #raceCount small { font-size: 13px; opacity: .7; font-weight: 600; margin-left: 4px; }
  .spacer { flex: 1; }
  .seg { display: inline-flex; background: #2c3650; border-radius: 9px; padding: 3px; }
  .seg button { background: transparent; color: #cfd6e8; padding: 4px 12px; border-radius: 7px; }
  .seg button.on { background: #fff; color: #1b2333; }
  .seg.locked button { cursor: default; opacity: .6; }
  #top .ghost { background: #2c3650; color: #fff; border: 0; } #top .ghost:hover:not(:disabled) { background: #3a4668; }
  #top button.go, #top button.stop { padding: 8px 20px; }
  #disconnected { display: none; background: var(--red); color: #fff; text-align: center; padding: 6px; font-weight: 700; }

  /* ---- ダッシュボード ---- */
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(300px, 5fr) 8fr; gap: 12px; padding: 12px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; min-height: 0;
           display: flex; flex-direction: column; overflow: hidden; }
  .panel > h2 { margin: 0; padding: 12px 16px 6px; font-size: 14px; color: var(--sub); letter-spacing: .06em; flex: none; }
  .scroll { overflow: auto; min-height: 0; flex: 1; padding: 0 16px 14px; }
  .empty { height: 100%; display: flex; align-items: center; justify-content: center; color: #b4bccd; font-size: 40px; }
  table { border-collapse: collapse; width: 100%; }
  th { text-align: left; font-size: 12px; color: var(--sub); font-weight: 700; padding: 4px 8px; border-bottom: 1px solid var(--line); }
  td { padding: 6px 8px; border-bottom: 1px solid #edf0f6; vertical-align: middle; }
  .r { text-align: right; font-variant-numeric: tabular-nums; }
  .dotc { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; vertical-align: -1px; }
  .dim { color: var(--sub); font-size: 12px; }
  #standings td.rank { font-size: 24px; font-weight: 900; width: 44px; }
  #standings td.total { font-size: 28px; font-weight: 900; }
  #standings td.gain { color: #c58a00; font-weight: 800; }
  #standings tr:first-child td.rank { color: #d99a00; }

  /* ---- 右パネル ---- */
  .tabs { display: flex; gap: 4px; padding: 8px 10px 0; border-bottom: 1px solid var(--line); flex: none; }
  .tabs button { background: transparent; color: var(--sub); border-radius: 9px 9px 0 0; padding: 7px 16px; position: relative; }
  .tabs button.on { color: var(--text); box-shadow: inset 0 -3px 0 var(--blue); }
  .tabs button .badge { position: absolute; top: 3px; right: 4px; width: 9px; height: 9px; border-radius: 50%; background: #f59e0b; }
  .tab { display: none; flex: 1; min-height: 0; flex-direction: column; } .tab.on { display: flex; }
  .rhead { display: flex; align-items: center; gap: 10px; padding: 10px 16px; flex: none; }
  .rhead b { font-size: 18px; }
  .tag { padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; }
  .tag.ok { background: var(--green-bg); color: var(--green); } .tag.warn { background: var(--amber-bg); color: var(--amber); }
  .todo { margin: 0 16px 8px; padding: 6px 12px; background: var(--amber-bg); color: var(--amber); border-radius: 9px; font-weight: 700; flex: none; }
  .flash { animation: flash 1.8s ease; }
  @keyframes flash { 0% { box-shadow: inset 0 0 0 4px rgba(31,157,85,.5); } 100% { box-shadow: inset 0 0 0 0 rgba(31,157,85,0); } }
  .pimg { height: 28px; width: 150px; object-fit: contain; background: #28303f; border-radius: 5px; display: block; }
  #resultBody td.n { font-weight: 800; width: 36px; }
  #resultBody input { width: 100%; }
  #resultBody tr.uncertain td { background: var(--amber-bg); }

  .players { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
  .player { border: 1px solid var(--line); border-radius: 11px; padding: 9px; background: #fafbfe; }
  .player .pimg { width: 100%; height: 30px; margin-bottom: 7px; }
  .player .f { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .player details { margin-top: 6px; font-size: 13px; } .player summary { cursor: pointer; color: var(--sub); }
  .player .inner { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  details.old { padding: 8px 0 0; } details.old summary { cursor: pointer; color: var(--sub); font-weight: 700; margin-bottom: 8px; }

  .obs { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row input { flex: 1; min-width: 240px; font-family: Consolas, monospace; font-size: 13px; }
  .preview { position: relative; width: 100%; max-width: 520px; aspect-ratio: 16/9; border-radius: 10px; overflow: hidden;
             background: conic-gradient(#3a4252 25%, #2b3240 0 50%, #3a4252 0 75%, #2b3240 0) 0 0 / 24px 24px; }
  .preview iframe { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; border: 0; transform-origin: 0 0; pointer-events: none; }

  /* ---- ダイアログ・通知 ---- */
  dialog { border: 0; border-radius: 14px; padding: 18px; box-shadow: 0 12px 40px rgba(0,0,0,.3); }
  dialog::backdrop { background: rgba(10, 14, 25, .5); }
  dialog h3 { margin: 0 0 12px; } dialog .btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  .cams { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; width: min(760px, 86vw); }
  .cam { border: 3px solid var(--line); border-radius: 11px; overflow: hidden; cursor: pointer; }
  .cam img { display: block; width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #111; }
  .cam .cap { padding: 4px 8px; font-size: 13px; display: flex; justify-content: space-between; }
  .cam.sel { border-color: var(--green); } .cam.sel .cap { background: var(--green-bg); color: var(--green); font-weight: 800; }
  #toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 50; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .toast { background: #1b2333; color: #fff; padding: 8px 16px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.25); font-weight: 700; }
  .toast.error { background: var(--red); }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; overflow: auto; } }
</style>
</head>
<body>
<header id="top">
  <span class="brand">MK8DX</span>
  <span class="chip" id="status"><i class="dot"></i><span id="statusText">未開始</span></span>
  <span id="raceCount">0<small>/ 12</small></span>
  <span class="spacer"></span>
  <button class="ghost" id="camBtn">映像ソース選択</button>
  <span class="seg" id="fmtSeg" title="1チームの人数">
    <button data-fmt="2v2">2v2</button><button data-fmt="3v3">3v3</button><button data-fmt="4v4">4v4</button>
  </span>
  <button class="ghost" id="undoBtn" title="直前のレースを取り消す">↶ 取り消し</button>
  <button class="ghost" id="newMatchBtn" title="新しい試合を始める">＋ 新しい試合</button>
  <button class="go" id="startBtn">▶ 開始</button>
  <button class="stop" id="stopBtn" hidden>■ 停止</button>
</header>
<div id="disconnected">接続が切れました。アプリを確認してページを開き直してください。</div>

<main>
  <section class="panel">
    <h2>順位</h2>
    <div class="scroll" id="standingsWrap">
      <table id="standings" hidden><tbody id="standingsBody"></tbody></table>
      <div class="empty" id="standingsEmpty">—</div>
    </div>
  </section>

  <section class="panel">
    <nav class="tabs">
      <button data-tab="result" class="on">結果<i class="badge" id="resultBadge" hidden></i></button>
      <button data-tab="players">選手</button>
      <button data-tab="obs">OBS</button>
    </nav>

    <div class="tab on" id="tab-result">
      <div id="resultEmpty" class="empty">—</div>
      <div id="resultBox" style="display:none;flex-direction:column;min-height:0;flex:1">
        <div class="rhead">
          <b id="rtitle"></b><span class="tag" id="rtag"></span>
          <span class="spacer"></span>
          <span id="pendingBtns" hidden>
            <button id="approveBtn">確定</button>
            <button class="ghost" id="discardBtn">使わない</button>
          </span>
        </div>
        <div class="todo" id="todo" hidden></div>
        <div class="scroll">
          <table><thead><tr><th>#</th><th>画面</th><th>選手</th><th>チーム</th><th class="r">点</th></tr></thead>
          <tbody id="resultBody"></tbody></table>
        </div>
      </div>
    </div>

    <div class="tab" id="tab-players">
      <div class="scroll" style="padding-top:12px">
        <div class="players" id="players"></div>
        <details class="old" id="oldWrap" hidden><summary id="oldSummary"></summary><div class="players" id="oldPlayers"></div></details>
        <div class="empty" id="playersEmpty">—</div>
      </div>
    </div>

    <div class="tab" id="tab-obs">
      <div class="obs">
        <div class="row">
          <input type="text" id="overlayUrl" readonly><button id="copyUrl">コピー</button>
        </div>
        <div class="row">
          小 <select id="optPos"><option value="tr">右上</option><option value="tl">左上</option><option value="br">右下</option><option value="bl">左下</option></select>
          大 <select id="optBig"><option value="left">左</option><option value="right">右</option></select>
          <select id="optSize"><option value="s">小</option><option value="m">中</option><option value="l">大</option></select>
        </div>
        <div class="preview" id="previewBox"><iframe id="previewFrame" title="プレビュー"></iframe></div>
      </div>
    </div>
  </section>
</main>

<datalist id="teamList"></datalist>
<div id="toast"></div>

<dialog id="camDlg">
  <h3>映像</h3>
  <div class="cams" id="cams"></div>
  <div class="btns"><button class="ghost" id="camRefresh">探す</button><button id="camClose">閉じる</button></div>
</dialog>
<dialog id="confirmDlg">
  <h3 id="dlgTitle"></h3>
  <label id="dlgOptWrap" hidden><input type="checkbox" id="dlgOpt"> <span id="dlgOptText"></span></label>
  <div class="btns"><button class="ghost" id="dlgCancel">やめる</button><button class="danger" id="dlgOk">実行</button></div>
</dialog>

<script>
'use strict';
const $ = (s) => document.querySelector(s);
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* 保存できなくても動く */ } },
};
let state = null;
let cameras = null;
let selectedCam = LS.get('cam', '');

// ---------- 道具 ----------
function h(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null) e.append(kid);
  return e;
}
function toast(message, kind = 'info') {
  const t = h('div', { class: 'toast ' + kind, text: message });
  $('#toast').append(t);
  setTimeout(() => t.remove(), kind === 'error' ? 6000 : 2200);
}
async function api(method, url, body) {
  let res, data = {};
  try {
    res = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: body === undefined ? undefined : JSON.stringify(body) });
    try { data = await res.json(); } catch { /* 本文なし */ }
  } catch { toast('接続できません', 'error'); return null; }
  if (!res.ok || data.ok === false) { toast(data.error || '失敗しました', 'error'); return null; }
  return data;
}
function confirmDialog({ title, okText = '実行', option = null }) {
  return new Promise((resolve) => {
    const dlg = $('#confirmDlg');
    $('#dlgTitle').textContent = title; $('#dlgOk').textContent = okText;
    $('#dlgOptWrap').hidden = !option; $('#dlgOpt').checked = false;
    if (option) $('#dlgOptText').textContent = option;
    const done = (ok) => { dlg.close(); resolve(ok ? { checked: $('#dlgOpt').checked } : null); };
    $('#dlgOk').onclick = () => done(true); $('#dlgCancel').onclick = () => done(false);
    dlg.onclose = () => resolve(null); dlg.showModal();
  });
}
// 入力中は上書きせず、確定（Enter・フォーカス外れ）で保存する
function bindField(input, save) {
  input.onchange = async () => {
    const v = input.value.trim();
    if (v === (input.dataset.remote || '')) return;
    if (await save(v)) { input.classList.add('saved'); setTimeout(() => input.classList.remove('saved'), 1000); }
  };
}
function syncField(input, value) {
  value = value ?? ''; input.dataset.remote = value;
  if (document.activeElement !== input) input.value = value;
}
function syncKeyed(container, items, keyFn, create, update) {
  const existing = new Map([...container.children].map((c) => [c.dataset.key, c]));
  const order = [];
  for (const item of items) {
    const key = String(keyFn(item));
    let node = existing.get(key);
    if (!node) { node = create(item); node.dataset.key = key; }
    update(node, item); order.push(node); existing.delete(key);
  }
  for (const node of existing.values()) node.remove();
  order.forEach((node, i) => { if (container.children[i] !== node) container.insertBefore(node, container.children[i] || null); });
}
const players = () => new Map((state.roster || []).map((p) => [p.id, p]));
const rename = (id) => (v) => v ? api('POST', `/api/roster/${id}/rename`, { name: v }) : Promise.resolve(null);
const setTeam = (id) => (v) => api('POST', `/api/roster/${id}/team`, { team: v });
const clock = (sec) => sec ? new Date(sec * 1000).toLocaleTimeString('ja-JP', { hour12: false }) : '';

// ---------- ヘッダー ----------
function statusOf(s) {
  const live = s.live || {}, m = s.match;
  if (live.error) return { cls: 'bad', text: 'エラー', title: live.error };
  if (!live.running) return { cls: '', text: m && m.current_race > 0 ? '停止中' : '未開始' };
  if (live.name_ocr === 'loading') return { cls: 'busy', text: '準備中' };
  if (live.frame_ago != null && live.frame_ago > 6) return { cls: 'bad', text: '映像なし', title: 'OBSの仮想カメラを確認してください' };
  switch (m && m.phase) {
    case 'RESULT_DETECTING': case 'PROCESSING': return { cls: 'busy', text: '読み取り中' };
    case 'AWAITING_REVIEW': return { cls: 'warn', text: '要確認' };
    case 'COOLDOWN': return { cls: 'ok', text: '集計済み' };
    case 'FINISHED': return { cls: 'ok', text: '終了' };
    default: return { cls: 'ok', text: '待機中' };
  }
}
function renderHeader(s) {
  const st = statusOf(s), live = s.live || {};
  $('#status').className = 'chip ' + st.cls;
  $('#status').title = st.title || '';
  $('#statusText').textContent = st.text;
  const m = s.match;
  $('#raceCount').innerHTML = `${m ? m.current_race : 0}<small>/ ${m ? m.total_races : 12}</small>`;
  $('#startBtn').hidden = !!live.running; $('#stopBtn').hidden = !live.running;
  $('#camBtn').disabled = !!live.running;
  const fmt = m ? m.format : LS.get('fmt', '2v2');
  $('#fmtSeg').classList.toggle('locked', !!live.running);
  $('#fmtSeg').querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.fmt === fmt));
  $('#undoBtn').disabled = !s.can_undo;
  $('#newMatchBtn').disabled = !!live.running;
}

// ---------- 順位 ----------
function renderStandings(s) {
  const teams = s.standings || [];
  $('#standings').hidden = !teams.length; $('#standingsEmpty').hidden = !!teams.length;
  $('#standingsBody').replaceChildren(...teams.map((t) => h('tr', {},
    h('td', { class: 'rank', text: t.rank }),
    h('td', {}, h('span', { class: 'dotc', style: `background:${t.color}` }), h('b', { text: t.tag }),
      h('div', { class: 'dim', text: (t.members || []).join('・') })),
    h('td', { class: 'r gain', text: t.last_race_points ? `+${t.last_race_points}` : '' }),
    h('td', { class: 'r total', text: t.total }))));
}

// ---------- 結果（確認待ち or 直前の集計） ----------
let shownResultId = null;
function renderResult(s) {
  const pendingMode = !!s.pending;
  const p = s.pending || s.last_result;
  $('#resultEmpty').hidden = !!p;
  const box = $('#resultBox'); box.style.display = p ? 'flex' : 'none';
  $('#resultBadge').hidden = !pendingMode;
  if (!p) { shownResultId = null; return; }
  $('#rtitle').textContent = `レース ${p.race_number}`;
  $('#rtag').className = 'tag ' + (pendingMode ? 'warn' : 'ok');
  $('#rtag').textContent = pendingMode ? '要確認' : `✓ ${clock(p.at)}`;
  $('#pendingBtns').hidden = !pendingMode;
  $('#approveBtn').disabled = !(pendingMode && p.can_approve);
  const todo = pendingMode ? (p.todo || []) : [];
  $('#todo').hidden = !todo.length; $('#todo').textContent = todo.join(' / ');
  if (shownResultId !== null && shownResultId !== p.race_result_id) {
    box.classList.remove('flash'); void box.offsetWidth; box.classList.add('flash');
    toast(pendingMode ? `レース ${p.race_number}：要確認` : `レース ${p.race_number} ✓`);
    if (pendingMode) switchTab('result');
  }
  shownResultId = p.race_result_id;

  const plist = players();
  syncKeyed($('#resultBody'), p.entries, (e) => e.rank, () => {
    const tr = h('tr');
    tr.append(h('td', { class: 'n' }), h('td'), h('td'), h('td'), h('td', { class: 'r' }));
    const ni = h('input', { type: 'text' }), ti = h('input', { type: 'text', list: 'teamList', placeholder: 'チーム' });
    tr.children[2].append(ni); tr.children[3].append(ti);
    bindField(ni, (v) => rename(Number(tr.dataset.entry))(v));
    bindField(ti, (v) => setTeam(Number(tr.dataset.entry))(v));
    return tr;
  }, (tr, e) => {
    const pl = e.entry_id != null ? plist.get(e.entry_id) : null;
    tr.dataset.entry = pl ? pl.id : '';
    tr.classList.toggle('uncertain', !!e.uncertain);
    tr.children[0].textContent = e.rank;
    const src = `/api/result/row/${e.rank}/image?v=${p.race_result_id}`;
    if (tr.children[1].dataset.src !== src) {
      tr.children[1].dataset.src = src;
      tr.children[1].replaceChildren(h('img', { class: 'pimg', src, alt: '' }));
    }
    const [ni, ti] = [tr.children[2].firstChild, tr.children[3].firstChild];
    ni.disabled = ti.disabled = !pl;
    syncField(ni, pl ? pl.name : ''); syncField(ti, pl ? pl.team : '');
    ni.title = e.uncertain ? '画面の名前と違う人かもしれません' : '';
    tr.children[4].textContent = e.score;
  });
}

// ---------- 選手 ----------
function playerCard(p) {
  const card = h('div', { class: 'player' });
  const name = h('input', { type: 'text' }), team = h('input', { type: 'text', list: 'teamList', placeholder: 'チーム' });
  card.append(h('div', { class: 'imgwrap' }), h('div', { class: 'f' }, name, team),
    h('details', {}, h('summary', { text: '…' }),
      h('div', { class: 'inner' },
        h('select', { class: 'mergeSel' }), h('button', { class: 'ghost sm mergeBtn', text: '同じ人として統合' }),
        h('button', { class: 'danger sm delBtn', text: '削除' }))));
  bindField(name, (v) => rename(Number(card.dataset.key))(v));
  bindField(team, (v) => setTeam(Number(card.dataset.key))(v));
  card.querySelector('.mergeBtn').onclick = async () => {
    const into = card.querySelector('.mergeSel').value;
    if (!into) return;
    if (await confirmDialog({ title: '同じ人として統合しますか？', okText: '統合' })) await api('POST', `/api/roster/${card.dataset.key}/merge`, { into: Number(into) });
  };
  card.querySelector('.delBtn').onclick = async () => {
    if (await confirmDialog({ title: 'この選手を削除しますか？', okText: '削除' })) await api('DELETE', `/api/roster/${card.dataset.key}`);
  };
  return card;
}
function updateCard(card, p, all) {
  const [name, team] = card.querySelectorAll('.f input');
  syncField(name, p.name); syncField(team, p.team);
  team.title = p.team_auto ? '自動で付けたチーム' : '';
  const wrap = card.querySelector('.imgwrap');
  const src = p.has_image ? `/api/roster/${p.id}/image?v=${p.image_v}` : '';
  if (wrap.dataset.src !== src) { wrap.dataset.src = src; wrap.replaceChildren(src ? h('img', { class: 'pimg', src, alt: '' }) : ''); }
  const sel = card.querySelector('.mergeSel');
  if (document.activeElement !== sel) {
    const cur = sel.value;
    sel.replaceChildren(h('option', { value: '', text: '統合先' }), ...all.filter((o) => o.id !== p.id).map((o) => h('option', { value: o.id, text: o.name })));
    sel.value = cur;
  }
}
function renderPlayers(s) {
  const all = s.roster || [];
  const cur = all.filter((p) => p.in_match).sort((a, b) => (a.team || '~').localeCompare(b.team || '~') || a.id - b.id);
  const old = all.filter((p) => !p.in_match);
  $('#playersEmpty').hidden = all.length > 0;
  syncKeyed($('#players'), cur, (p) => p.id, playerCard, (c, p) => updateCard(c, p, all));
  $('#oldWrap').hidden = !old.length; $('#oldSummary').textContent = `過去の選手 ${old.length}`;
  syncKeyed($('#oldPlayers'), old, (p) => p.id, playerCard, (c, p) => updateCard(c, p, all));
  $('#teamList').replaceChildren(...(s.team_names || []).map((t) => h('option', { value: t })));
}

// ---------- 映像・開始・メニュー ----------
function renderCams() {
  const box = $('#cams');
  box.replaceChildren(...(cameras || []).map((c) => h('div',
    { class: 'cam' + (String(c.index) === selectedCam ? ' sel' : ''),
      onclick: () => { selectedCam = String(c.index); LS.set('cam', selectedCam); $('#camDlg').close(); if (state) renderHeader(state); } },
    h('img', { src: `/api/cameras/${c.index}/preview?t=${Date.now()}`, alt: '' }),
    h('div', { class: 'cap' }, h('span', { text: `映像 ${c.index + 1}` }), h('span', { text: `${c.width}×${c.height}` })))));
  if (cameras && !cameras.length) box.replaceChildren(h('div', { class: 'dim', text: '映像が見つかりません（OBSの仮想カメラを開始してください）' }));
}
async function findCameras() {
  $('#camRefresh').disabled = true;
  try {
    const res = await fetch('/api/cameras');
    if (res.status === 409) return;
    const data = await res.json();
    cameras = data.cameras || [];
    if (selectedCam !== '' && !cameras.some((c) => String(c.index) === selectedCam)) selectedCam = '';
    renderCams(); if (state) renderHeader(state);
  } catch { toast('接続できません', 'error'); } finally { $('#camRefresh').disabled = false; }
}
async function openCams() { $('#camDlg').showModal(); renderCams(); if (cameras === null) await findCameras(); }

async function start() {
  if (selectedCam === '') { await openCams(); return; }
  const fmt = state && state.match ? state.match.format : LS.get('fmt', '2v2');
  if (!state.match) await api('POST', '/api/session', { format: fmt });
  await api('POST', '/api/live/start', { device_index: Number(selectedCam) });
}
async function chooseFormat(fmt) {
  if (state.live && state.live.running) return;
  const cur = state.match ? state.match.format : LS.get('fmt', '2v2');
  if (fmt === cur) return;
  if ((state.match ? state.match.current_race : 0) > 0 &&
      !await confirmDialog({ title: '形式を変えると新しい試合になります', okText: '変更' })) return;
  LS.set('fmt', fmt); await api('POST', '/api/session', { format: fmt });
}
function switchTab(name) {
  document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === name));
  document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('on', t.id === 'tab-' + name));
}

// ---------- OBS ----------
function updateOverlayUrl() {
  const pos = $('#optPos').value, big = $('#optBig').value, size = $('#optSize').value;
  LS.set('opt.pos', pos); LS.set('opt.big', big); LS.set('opt.size', size);
  const url = `${location.origin}/overlay?pos=${pos}&big=${big}&size=${size}`;
  $('#overlayUrl').value = url;
  const f = $('#previewFrame');
  if (f.dataset.src !== url) { f.dataset.src = url; f.src = url; }
}
function fitPreview() { $('#previewFrame').style.transform = `scale(${$('#previewBox').clientWidth / 1920})`; }

// ---------- 全体 ----------
function render(s) {
  state = s;
  renderHeader(s); renderStandings(s); renderResult(s); renderPlayers(s);
}
function connect() {
  const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
  ws.onopen = () => { $('#disconnected').style.display = 'none'; };
  ws.onmessage = (ev) => { const msg = JSON.parse(ev.data); if (msg.type === 'STATE_UPDATE') render(msg); };
  ws.onclose = () => { $('#disconnected').style.display = 'block'; setTimeout(connect, 2000); };
}

document.querySelectorAll('.tabs button').forEach((b) => { b.onclick = () => { switchTab(b.dataset.tab); if (b.dataset.tab === 'obs') fitPreview(); }; });
document.querySelectorAll('#fmtSeg button').forEach((b) => { b.onclick = () => chooseFormat(b.dataset.fmt); });
$('#camBtn').onclick = openCams; $('#camRefresh').onclick = findCameras; $('#camClose').onclick = () => $('#camDlg').close();
$('#startBtn').onclick = start; $('#stopBtn').onclick = () => api('POST', '/api/live/stop');
$('#status').onclick = () => { const t = $('#status').title; if (t) toast(t, 'error'); };
$('#approveBtn').onclick = async () => { if (await api('POST', '/api/review/approve')) toast('確定'); };
$('#discardBtn').onclick = async () => { if (await confirmDialog({ title: 'この結果を使いませんか？', okText: '使わない' })) await api('POST', '/api/review/discard'); };
$('#undoBtn').onclick = async () => { if (await confirmDialog({ title: '直前のレースを取り消しますか？', okText: '取り消す' }) && await api('POST', '/api/race/undo')) toast('取り消しました'); };
$('#newMatchBtn').onclick = async () => {
  const r = await confirmDialog({ title: '新しい試合', okText: '開始', option: '選手の登録も消す' });
  if (r) await api('POST', '/api/session', { format: state.match ? state.match.format : LS.get('fmt', '2v2'), reset_roster: r.checked });
};
$('#copyUrl').onclick = async () => {
  const i = $('#overlayUrl');
  try { await navigator.clipboard.writeText(i.value); } catch { i.select(); document.execCommand('copy'); }
  toast('コピーしました');
};
$('#optPos').value = LS.get('opt.pos', 'tr'); $('#optBig').value = LS.get('opt.big', 'left'); $('#optSize').value = LS.get('opt.size', 'm');
$('#optPos').onchange = $('#optBig').onchange = $('#optSize').onchange = updateOverlayUrl;
window.addEventListener('resize', fitPreview);
updateOverlayUrl(); fitPreview(); connect(); findCameras();
</script>
</body>
</html>
